[package]
name = "efir-desktop"
version = "1.3.2"
edition = "2021"
default-run = "efir"
autobins = false
build = "build.rs"

[features]
default = ["shell"]
shell = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:rfd", "dep:cpal", "dep:libloading", "dep:keepawake", "dep:dirs", "dep:sys-locale", "dep:gtk"]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "sync", "signal", "time", "io-util", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
percent-encoding = "2"
netdev = "0.40"
mdns-sd = "0.18"
tauri = { version = "2.12", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
rfd = { version = "0.17", optional = true }
cpal = { version = "0.17", optional = true }
libloading = { version = "0.8", optional = true }
keepawake = { version = "0.6", optional = true }
dirs = { version = "6", optional = true }
sys-locale = { version = "0.3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[[bin]]
name = "efir"
path = "src/main.rs"
required-features = ["shell"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "s"
