name: Build Efir
on:
  workflow_dispatch:
  push:
    paths: ['web/**', 'mac/**', 'desktop/**', 'android/**', 'script/**', '.github/workflows/build.yml']
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: ./script/build_and_run.sh --release
      - run: ditto -c -k --sequesterRsrc --keepParent mac/build/Build/Products/Release/Efir.app Efir-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Efir-macOS
          path: Efir-macOS.zip
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: windows-x64
            bundle: nsis
          - os: ubuntu-24.04
            runtime: linux-x64
            bundle: deb
          - os: ubuntu-24.04-arm
            runtime: linux-arm64
            bundle: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libasound2-dev librsvg2-dev patchelf
      - run: node script/fetch_speech_runtime.mjs ${{ matrix.runtime }}
      - run: npm ci
        working-directory: desktop
      - run: npx tauri build --bundles ${{ matrix.bundle }}
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Efir-${{ matrix.runtime }}
          path: |
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/deb/*.deb
          if-no-files-found: error
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: ./gradlew assembleRelease lintRelease
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: Efir-Android-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
