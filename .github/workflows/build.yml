name: Build Efir
on:
  workflow_dispatch:
  push:
    paths: ['web/**', 'mac/**', 'desktop/**', 'android/**', 'script/**', '.github/workflows/build.yml']
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: ./script/build_and_run.sh --release
      - run: ditto -c -k --sequesterRsrc --keepParent mac/build/Build/Products/Release/Efir.app Efir-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Efir-macOS
          path: Efir-macOS.zip
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: windows-x64
            bundle: nsis
          - os: ubuntu-24.04
            runtime: linux-x64
            bundle: deb
          - os: ubuntu-24.04-arm
            runtime: linux-arm64
            bundle: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libasound2-dev librsvg2-dev patchelf
      - run: node script/fetch_speech_runtime.mjs ${{ matrix.runtime }}
      - run: npm ci
        working-directory: desktop
      - run: npx tauri build --bundles ${{ matrix.bundle }}
        working-directory: desktop
      - name: Package portable Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $release = 'desktop/target/release'
          $portable = "$release/bundle/portable/Efir-Windows-x64"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item "$release/efir.exe" $portable
          Get-ChildItem $release -Filter '*.dll' | Copy-Item -Destination $portable
          Copy-Item 'desktop/resources/web' "$portable/web" -Recurse
          Copy-Item 'desktop/resources/speech' "$portable/speech" -Recurse
          Copy-Item 'LICENSE' "$portable/LICENSE.txt"
          $version = (Get-Content 'desktop/package.json' | ConvertFrom-Json).version
          @'
          Extract this whole folder, then run efir.exe. Keep web/ and speech/ beside it.
          Windows 10/11 x64 and Microsoft WebView2 Runtime are required.
          Vosk language models are selected separately in voice settings.
          '@ | Set-Content "$portable/START.txt" -Encoding utf8
          $app = Start-Process "$portable/efir.exe" -WorkingDirectory $portable -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if ($app.HasExited) { throw "Portable app exited: $($app.ExitCode)" }
              try {
                $info = Invoke-RestMethod 'http://localhost:8765/efir-local.json' -TimeoutSec 1
                if ($info.local -eq $true -and $info.platform -eq 'windows' -and $info.version -eq $version) { $ready = $true; break }
              } catch { }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw 'Portable app did not start its local server' }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
          Compress-Archive -Path $portable -DestinationPath "$release/bundle/portable/Efir-Windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Efir-${{ matrix.runtime }}
          path: |
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/deb/*.deb
            desktop/target/release/bundle/portable/*.zip
          if-no-files-found: error
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: ./gradlew assembleRelease lintRelease
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: Efir-Android-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
